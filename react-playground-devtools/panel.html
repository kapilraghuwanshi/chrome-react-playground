<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self';
                 script-src 'self' 'unsafe-eval';
                 style-src 'self' 'unsafe-inline';
                 worker-src 'self' blob:;
                 frame-src 'self';
                 object-src 'none';" />
  <title>React Playground DevTools</title>
  <script type="module" src="init-editor.js"></script>
  <style>
    :root {
      --bg-primary: #282c34;
      --bg-secondary: #21252b;
      --text-primary: #abb2bf;
      --text-secondary: #5c6370;
      --accent-blue: #61dafb;
      --accent-green: #98c379;
      --accent-orange: #d19a66;
      --line-numbers: #495162;
      --selection-bg: #3e4451;
    }

    /* CodeMirror specific styles */
    .cm-editor {
      height: 300px !important;
      border-radius: 4px;
      border: 1px solid #181a1f;
      font-family: 'JetBrains Mono', 'Fira Code', monospace !important;
      font-size: 14px !important;
    }

    .cm-editor .cm-scroller {
      line-height: 1.6 !important;
    }

    .cm-editor .cm-gutters {
      border-right: 1px solid #181a1f !important;
      background: var(--bg-secondary) !important;
    }

    .cm-editor .cm-lineNumbers .cm-gutterElement {
      padding: 0 10px 0 5px !important;
      color: var(--line-numbers) !important;
    }

    .cm-editor .cm-activeLineGutter {
      background-color: #2c313a !important;
      color: var(--text-primary) !important;
    }

    .cm-editor .cm-activeLine {
      background-color: #2c313a !important;
    }

    .cm-editor .cm-selectionBackground {
      background: var(--selection-bg) !important;
    }

    /* Custom scrollbar for editor */
    .cm-scroller::-webkit-scrollbar {
      width: 14px;
      height: 14px;
    }

    .cm-scroller::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    .cm-scroller::-webkit-scrollbar-thumb {
      background: #3b4048;
      border: 3px solid var(--bg-primary);
      border-radius: 7px;
    }

    .cm-scroller::-webkit-scrollbar-thumb:hover {
      background: #464c55;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 8px;
      position: relative;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    #editor { 
      width: 100%;
      height: 240px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.5;
      padding: 12px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid #181a1f;
      border-radius: 4px;
      resize: vertical;
      tab-size: 2;
      outline: none;
      transition: border-color 0.2s;
    }

    #editor:focus {
      border-color: #528bff40;
      box-shadow: 0 0 0 2px #528bff20;
    }

    #editor::selection {
      background: var(--selection-bg);
    }

    #controls { 
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #controls button {
      padding: 6px 12px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid #181a1f;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    #controls button:hover {
      background: #2c313a;
      border-color: var(--accent-blue);
    }

    #status { 
      margin-left: 12px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    #iframeWrap { 
      margin-top: 12px;
      border: 1px solid #181a1f;
      border-radius: 4px;
      height: 320px;
      background: var(--bg-secondary);
    }

    .header-container { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 12px;
      padding: 4px 0;
    }

    .header-container h3 {
      color: var(--accent-blue);
      margin: 0;
      font-weight: 500;
    }

    .creator-badge {
      font-style: italic;
      font-size: 12px;
      color: var(--text-secondary);
      margin-right: 8px;
    }

    .creator-badge a {
      color: var(--accent-blue);
      text-decoration: none;
      transition: color 0.2s;
    }

    .creator-badge a:hover {
      color: #528bff;
      text-decoration: none;
    }

    /* Placeholder text styling */
    #editor::placeholder {
      color: var(--text-secondary);
    }

    /* Custom scrollbar */
    #editor::-webkit-scrollbar {
      width: 14px;
      height: 14px;
    }

    #editor::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    #editor::-webkit-scrollbar-thumb {
      background: #3b4048;
      border: 3px solid var(--bg-primary);
      border-radius: 7px;
    }

    #editor::-webkit-scrollbar-thumb:hover {
      background: #464c55;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <h3>React Playground DevTools</h3>
    <div class="creator-badge">
      Built by <a href="https://www.linkedin.com/in/kapilraghuwanshi/" target="_blank">Tech Monk-Kapil</a>
    </div>
  </div>
  <div id="editor"></div>
  <div id="controls">
    <button id="run">Run</button>
    <button id="format">Format Code</button>
    <button id="sample">Insert Sample</button>
    <span id="status"></span>
  </div>

  <div id="iframeWrap">
    <!-- sandboxed iframe will be created programmatically -->
  </div>

  <!-- Script loader with fallback -->
  <script>
    function loadScript(localPath, cdnPath) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.onload = resolve;
        script.onerror = () => {
          console.log(`Local ${localPath} failed, trying CDN...`);
          script.src = cdnPath;
          script.onerror = reject;
        };
        script.src = localPath;
        document.body.appendChild(script);
      });
    }

    // Load dependencies with fallback to CDN
    Promise.all([
      loadScript('vendor/babel.min.js', 'https://unpkg.com/@babel/standalone/babel.min.js'),
      loadScript('vendor/react.development.js', 'https://unpkg.com/react@latest/umd/react.development.js'),
      loadScript('vendor/react-dom.development.js', 'https://unpkg.com/react-dom@latest/umd/react-dom.development.js'),
      loadScript('vendor/prettier.standalone.js', 'https://unpkg.com/prettier@3.0.3/standalone.js'),
      loadScript('vendor/prettier.parser-babel.js', 'https://unpkg.com/prettier@3.0.3/parser-babel.js')
    ]).then(() => {
      // Load panel.js after dependencies are loaded
      const script = document.createElement('script');
      script.src = 'panel.js';
      document.body.appendChild(script);
    }).catch(err => {
      console.error('Failed to load dependencies:', err);
    });
  </script>
</body>
</html>
